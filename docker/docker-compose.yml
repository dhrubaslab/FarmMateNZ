services:
  backend:
    build: ../backend
    container_name: farmmatenz-backend
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    environment:
      - AWS_REGION=us-east-1
      - SNS_TOPIC_ARN=${SNS_TOPIC_ARN}
      - JWT_SECRET_NAME=FarmMateNZ/AppSecret          
  frontend:
    build: ../frontend
    container_name: farmmatenz-frontend
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules